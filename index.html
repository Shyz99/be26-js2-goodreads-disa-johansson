<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/styles/global.css" />
    <link rel="stylesheet" href="./src/styles/bookContainer.css" />
    <script src="./src/main.js" type="module"></script>

    <title>Goodreads - Disa Johansson</title>
  </head>
  <body>
    <h1>Goodreads</h1>
    <form id="formInputNewBooks" class="formContainer">
  <!-- ! Ge namnvärden för att kunna hämta form data -->
        <input class="inputComponents" type="text" name="tilteInput" placeholder="Book Title"></input>
        <input class="inputComponents" type="text" name="authorInput" placeholder="Author"></input>
        <input type="number" min="0" max="10" name="scoreInput" placeholder="Score [0 - 10]"></input>
        <!-- ! Kan sätta ett label element istället  -->
        <label class="inputComponents">
            <input type="checkbox" name="isReadInput">Read</input>
        </label>
        <button class="inputComponents" name="submit">Submit</button>
    </form>

    <button id="delBtn">DELTE TEMP</button>

    <div class="displayBooks" id="displayBooks">
        <h2>Books</h2>
    </div>
    
  </body>
</html>
